spring.application.name=coreFlowShop
server.servlet.session.tracking-modes=cookie
server.port=${port:8080}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.servlet.multipart.enabled=true
spring.servlet.multipart.location=/tmp/upload/pds
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=100MB
com.coreflow.upload.path=/tmp/upload/pds
com.coreflow.upload.ckeditor.path=/tmp/upload/ckeditor
kakao.authorize=https://kauth.kakao.com/oauth/authorize
kakao.client_id=${KAKAO_CLIENT_ID}
kakao.client_secret=${KAKAO_CLIENT_SECRET}
kakao.redirect_uri=https://coreflowpersonal-production.up.railway.app/member/kakao/callback
kakao.user.logout=https://kapi.kakao.com/v1/user/logout
kakao.token_url=https://kauth.kakao.com/oauth/token
readUrl=https://open-api.kakaopay.com/online/v1/payment/ready
approveUrl=https://open-api.kakaopay.com/online/v1/payment/approve
secretKey=${KAKAO_PAY_SECRET}
cid=TC0ONETIME
approval=https://coreflowpersonal-production.up.railway.app/kakao/approval
cancel=https://coreflowpersonal-production.up.railway.app/kakao/cancel
fail=https://coreflowpersonal-production.up.railway.app/kakao/fail
kakaosecretKey=${KAKAO_PAY_SECRET}
kakaocid=TC0ONETIME
emailusername=${EMAIL_USERNAME}
emailpassword=${EMAIL_PASSWORD}
openai.api-key=${OPENAI_API_KEY}